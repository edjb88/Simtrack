name: Build iOS App

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Verificar version de Xcode
        run: xcodebuild -version

      - name: Diagnosticar archivos y proyecto
        run: |
          echo "=== Archivos en la raiz ==="
          ls -la
          echo "=== Buscar todos los ContentView.swift ==="
          find . -name "ContentView.swift"
          echo "=== Primeras lineas de ContentView.swift en la raiz ==="
          head -30 ContentView.swift
          echo "=== Referencias a ContentView en project.pbxproj ==="
          grep -n "ContentView" Simtrack.xcodeproj/project.pbxproj

      - name: Listar schemes disponibles
        run: xcodebuild -list -project Simtrack.xcodeproj

      - name: Compilar la app sin firmar
        run: |
          xcodebuild clean build -project Simtrack.xcodeproj -scheme Simtrack -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ./build

      - name: Diagnostico del binario
        run: |
          echo "Buscando cadenas del codigo nuevo en el binario:"
          strings ./build/Build/Products/Release-iphoneos/Simtrack.app/Simtrack | grep -i "Tracking\|Auriculares\|Dashboard\|Cara" || echo "NO SE ENCONTRARON CADENAS DEL CODIGO NUEVO"

      - name: Empaquetar el ipa sin firmar
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Simtrack.app Payload/
          zip -r Simtrack-unsigned.ipa Payload
          unzip -l Simtrack-unsigned.ipa

      - name: Subir el ipa como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Simtrack-unsigned-ipa
          path: Simtrack-unsigned.ipa
