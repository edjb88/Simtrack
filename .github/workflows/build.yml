name: Build iOS App

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Compilar la app sin firmar
        run: xcodebuild clean build -project Simtrack.xcodeproj -scheme Simtrack -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ./build

      - name: Diagnostico del binario
        run: |
          strings ./build/Build/Products/Release-iphoneos/Simtrack.app/Simtrack > /tmp/strings.txt
          grep -qi "Tracking" /tmp/strings.txt && echo "OK: codigo nuevo presente" || echo "FALLO: codigo nuevo ausente"

      - name: Empaquetar el ipa sin firmar
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Simtrack.app Payload/
          zip -r Simtrack-unsigned.ipa Payload
          unzip -l Simtrack-unsigned.ipa

      - name: Subir el ipa como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Simtrack-unsigned-ipa
          path: Simtrack-unsigned.ipa