name: Build iOS App

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v5

      - name: Compilar la app sin firmar
        run: |
          set -o pipefail
          xcodebuild clean build -project Simtrack.xcodeproj -scheme Simtrack -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ./build 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild ha fallado"
            grep -E "error:" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Publicar el log si falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'sin build.log';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch (error) {
              log = 'no se pudo leer build.log: ' + error.message;
            }
            const tail = log.slice(-60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Log de compilacion:\n\n```\n' + tail + '\n```'
            });

      - name: Diagnostico del binario
        run: |
          strings ./build/Build/Products/Release-iphoneos/Simtrack.app/Simtrack > /tmp/strings.txt
          grep -qi "Tracking" /tmp/strings.txt && echo "OK: codigo nuevo presente" || echo "FALLO: codigo nuevo ausente"

      - name: Empaquetar el ipa sin firmar
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Simtrack.app Payload/
          zip -r Simtrack-unsigned.ipa Payload
          unzip -l Simtrack-unsigned.ipa

      - name: Subir el ipa como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Simtrack-unsigned-ipa
          path: Simtrack-unsigned.ipa
